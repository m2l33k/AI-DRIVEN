name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Platform area
      options:
        - Security / anomaly detection
        - Roaming analysis / ML
        - 5G Core integration
        - Observability / Grafana
        - Authentication / RBAC
        - Frontend / UI
        - CI/CD / DevOps
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've considered.
