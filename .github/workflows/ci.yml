name: CI

# ---------------------------------------------------------------------------
#  Powerful, security-focused CI for the auth-management-system platform.
#
#  Pipeline stages (fan-out after build):
#    build-and-test  -> compile, unit/integration tests, JaCoCo coverage
#    static-analysis -> SpotBugs + PMD (advisory)
#    secret-scan     -> Gitleaks
#    trivy-fs        -> filesystem + dependency + misconfig scan (SARIF)
#    dependency-review (PRs) -> block vulnerable/licence-violating deps
#    docker          -> per-service image build, Trivy image scan, SBOM,
#                       push to GHCR + keyless Cosign signing (main/tags)
#    ci-success      -> single required status gate
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default; jobs elevate only what they need.
permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  REGISTRY: ghcr.io
  MAVEN_ARGS: '-B -ntp -Dstyle.color=always'
  JACOCO_VERSION: '0.8.13'

jobs:
  # =========================================================================
  # 1) Build, test, and measure coverage across the whole Maven reactor.
  # =========================================================================
  build-and-test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # dorny/test-reporter publishes a check run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate the build (effective POM, enforce)
        run: ./mvnw ${MAVEN_ARGS} -DskipTests validate

      - name: Build, test & verify with coverage
        run: |
          ./mvnw ${MAVEN_ARGS} \
            org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:prepare-agent \
            verify \
            org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:report

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit & Integration Tests
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/**'
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unittests
          disable_search: false

  # =========================================================================
  # 2) Static analysis (advisory — never blocks, surfaces findings early).
  # =========================================================================
  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: chmod +x mvnw

      - name: SpotBugs (incl. FindSecBugs-style checks)
        run: |
          ./mvnw ${MAVEN_ARGS} -DskipTests compile \
            com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check \
            -Dspotbugs.effort=Max -Dspotbugs.threshold=Medium || true

      - name: PMD source analysis
        run: |
          ./mvnw ${MAVEN_ARGS} -DskipTests \
            org.apache.maven.plugins:maven-pmd-plugin:3.26.0:check || true

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            **/target/spotbugsXml.xml
            **/target/pmd.xml
            **/target/site/**
          retention-days: 7
          if-no-files-found: ignore

  # =========================================================================
  # 3) Secret scanning of the full git history.
  # =========================================================================
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  # =========================================================================
  # 4) Filesystem / dependency / misconfiguration scan -> Code Scanning.
  # =========================================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scanners: 'vuln,secret,misconfig'
          format: sarif
          output: trivy-fs.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        # Requires GitHub Advanced Security on private repos; never block CI on it.
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Archive Trivy SARIF (always available)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          retention-days: 7
          if-no-files-found: ignore

  # =========================================================================
  # 5) Block PRs that introduce vulnerable or non-compliant dependencies.
  # =========================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          license-check: true

  # =========================================================================
  # 6) Per-service container image: build -> scan -> SBOM -> push -> sign.
  # =========================================================================
  docker:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write        # push to GHCR
      security-events: write # upload image scan SARIF
      id-token: write        # keyless cosign signing (OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eureka-server
            module: spring-cloud/eureka-server
          - name: gateway-service
            module: spring-cloud/gateway-service
          - name: auth-service
            module: microservices/auth-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build service JAR
        run: |
          chmod +x mvnw
          ./mvnw ${MAVEN_ARGS} -pl ${{ matrix.module }} -am package -DskipTests

      - name: Compute lowercase image name
        id: img
        run: echo "name=${REGISTRY,,}/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload image scan SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        # Requires GitHub Advanced Security on private repos; never block CI on it.
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

      - name: Archive image scan SARIF (always available)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-${{ matrix.name }}-sarif
          path: trivy-image-${{ matrix.name }}.sarif
          retention-days: 7
          if-no-files-found: ignore

      - name: Trivy image gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          format: table
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      # --- Publish only on pushes to main or version tags (never on PRs) ---
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless / Sigstore)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.img.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # =========================================================================
  # 7) Single required status check — make THIS the branch-protection gate.
  # =========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [build-and-test, secret-scan, trivy-fs, docker]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "build-and-test: ${{ needs.build-and-test.result }}"
          echo "secret-scan:    ${{ needs.secret-scan.result }}"
          echo "trivy-fs:       ${{ needs.trivy-fs.result }}"
          echo "docker:         ${{ needs.docker.result }}"
          if [ "${{ needs.build-and-test.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.trivy-fs.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
