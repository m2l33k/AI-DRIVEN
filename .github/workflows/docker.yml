name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: '17'

# ─────────────────────────────────────────────────────────────────────────────
jobs:

# ── 1. Build all Spring Boot JARs ─────────────────────────────────────────────
  build-jars:
    name: Build JARs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build all modules
        run: mvn -B clean package -DskipTests --no-transfer-progress -T 4

      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: service-jars
          path: |
            microservices/*/target/*.jar
            spring-cloud/*/target/*.jar
          retention-days: 1

# ── 2. Build & push service images (matrix) ───────────────────────────────────
  docker-services:
    name: Docker — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-jars
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: microservices/auth-service
          - name: roaming-analysis-service
            context: microservices/roaming-analysis-service
          - name: anomaly-detection-service
            context: microservices/anomaly-detection-service
          - name: rate-limiting-service
            context: microservices/rate-limiting-service
          - name: audit-service
            context: microservices/audit-service
          - name: messaging-service
            context: microservices/messaging-service
          - name: fivegc-service
            context: microservices/fivegc-service
          - name: distributed-tracing-service
            context: microservices/distributed-tracing-service
          - name: fault-injection-service
            context: microservices/fault-injection-service
          - name: gateway-service
            context: spring-cloud/gateway-service
          - name: eureka-server
            context: spring-cloud/eureka-server

    steps:
      - uses: actions/checkout@v7

      - name: Download JARs
        uses: actions/download-artifact@v8
        with:
          name: service-jars

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Trivy scan — ${{ matrix.service.name }}
        uses: aquasecurity/trivy-action@v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.name }}:latest
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: CRITICAL
          ignore-unfixed: true

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request'
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}

# ── 3. ML service image ───────────────────────────────────────────────────────
  docker-ml:
    name: Docker — ml-service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ml-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ML image
        uses: docker/build-push-action@v6
        with:
          context: ml-service
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=ml-service
          cache-to: type=gha,mode=max,scope=ml-service
