name: CodeQL

# Deep static application security testing (SAST) for Java.
# Runs on pushes/PRs to main and on a weekly schedule to catch newly
# disclosed query updates against unchanged code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'   # Mondays 03:27 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to Code Scanning
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Build (manual)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean compile -DskipTests

      - name: Perform CodeQL Analysis
        id: analyze
        # Uploading results needs Code Scanning (GitHub Advanced Security on private
        # repos). If it is not enabled, the upload fails but we do not block CI — the
        # SARIF is still produced and archived below. Enable GHAS to light up the
        # Security tab automatically.
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          output: codeql-results
          upload: always

      - name: Archive CodeQL SARIF (always available)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results
          retention-days: 7
          if-no-files-found: ignore
