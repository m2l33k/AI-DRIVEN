global:
  scrape_interval: 15s

scrape_configs:
  # eureka + gateway run as host JVM processes; reach them via the Docker Desktop host gateway.
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9000']

  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8761']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9001']

  - job_name: 'roaming-analysis-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9002']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
