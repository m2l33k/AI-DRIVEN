services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--enable-feature=remote-write-receiver'   # accept push from Tempo metrics_generator
    ports:
      - "9090:9090"
    networks:
      - shared-network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ../grafana-dashboard:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - shared-network

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - shared-network

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:2.9.8
    container_name: fluent-bit
    ports:
      - "24224:24224"
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
    networks:
      - shared-network
  tempo:
    image: grafana/tempo:latest
    command: -config.file /etc/tempo-config.yml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3200:3200" # Tempo HTTP server (for querying)
    volumes:
      - ./tempo/tempo.yml:/etc/tempo-config.yml
    networks:
      - shared-network

  # ---- Storage / Redis exporters (feed the "Redis & Storage" Grafana dashboard) ----
  # Redis containers + DBs live in docker-compose-infra.yml; infra.sh brings both compose files up
  # on the same shared-network, so these exporters and Prometheus can reach them by container name.

  # One exporter scrapes BOTH Redis via Prometheus multi-target (see prometheus.yml 'redis' job).
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    ports:
      - "9121:9121"
    networks:
      - shared-network

  # Postgres exporters — one per server (creds differ per DB). Add anomaly/tracing/fault the same way.
  postgres-exporter-keycloak:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-keycloak
    environment:
      - DATA_SOURCE_NAME=postgresql://keycloak:keycloak@keycloak-postgres:5432/keycloak_db?sslmode=disable
    networks:
      - shared-network

  postgres-exporter-ratelimit:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-ratelimit
    environment:
      - DATA_SOURCE_NAME=postgresql://ratelimit:ratelimit@ratelimit-postgres:5432/ratelimit_db?sslmode=disable
    networks:
      - shared-network

  # MySQL exporter for the roaming DB. v0.14.0 supports the DATA_SOURCE_NAME env form.
  mysqld-exporter-roaming:
    image: prom/mysqld-exporter:v0.14.0
    container_name: mysqld-exporter-roaming
    environment:
      - DATA_SOURCE_NAME=roaming:roaming@(roaming-mysql:3306)/
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: telecom-shared-network   # defined in docker-compose-infra.yml
volumes:
  prometheus-data:
  grafana-data:
  loki-data: