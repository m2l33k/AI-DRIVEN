services:
  mongodb:
    image: mongo:6.0.4
    container_name: "mongodb"
    mem_limit: 512m
    ports:
      - "27017:27017"
    command: mongod
    healthcheck:
      test: "mongostat -n 1"
    networks:
      - shared-network

  postgres:
    image: "postgres:17.4"
    container_name: "postgres"
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pwd
      - POSTGRES_DB=course_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared-network

  roaming-mysql:
    image: "mysql:8.4"
    container_name: "roaming-mysql"
    mem_limit: 512m
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=roaming_db
      - MYSQL_USER=roaming
      - MYSQL_PASSWORD=roaming
      - MYSQL_ROOT_PASSWORD=root
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroaming", "-proaming" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - roaming-mysql-data:/var/lib/mysql
    networks:
      - shared-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Reuse the same Gmail account as auth-service for realm SMTP (verify-email links).
      # These fill the ${...} placeholders in platform-realm.json on import.
      KC_SMTP_USER: ${MAIL_USERNAME:-}
      KC_SMTP_PASSWORD: ${MAIL_PASSWORD:-}
    # --import-realm loads platform-realm.json on a fresh instance (skipped if the realm exists).
    command: [ "start-dev", "--import-realm" ]
    volumes:
      - ../keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge
volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  roaming-mysql-data: