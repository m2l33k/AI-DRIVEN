services:
  mongodb:
    image: mongo:6.0.4
    container_name: "mongodb"
    mem_limit: 512m
    ports:
      - "27017:27017"
    command: mongod
    healthcheck:
      test: "mongostat -n 1"
    networks:
      - shared-network

  postgres:
    image: "postgres:17.4"
    container_name: "postgres"
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pwd
      - POSTGRES_DB=course_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared-network

  roaming-mysql:
    image: "mysql:8.4"
    container_name: "roaming-mysql"
    mem_limit: 512m
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=roaming_db
      - MYSQL_USER=roaming
      - MYSQL_PASSWORD=roaming
      - MYSQL_ROOT_PASSWORD=root
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroaming", "-proaming" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - roaming-mysql-data:/var/lib/mysql
    networks:
      - shared-network

  # Dedicated Postgres so Keycloak data (users, realm changes) survives restarts and
  # `infra.sh down` (only wiped by `down -v`). Replaces the ephemeral embedded H2.
  keycloak-postgres:
    image: "postgres:17.4"
    container_name: "keycloak-postgres"
    mem_limit: 256m
    ports:
      - "5437:5432"
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
      - POSTGRES_DB=keycloak_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - shared-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Persist to the dedicated Postgres instead of the container-local H2.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Reuse the same Gmail account as auth-service for realm SMTP (verify-email links).
      # These fill the ${...} placeholders in platform-realm.json on import.
      KC_SMTP_USER: ${MAIL_USERNAME:-}
      KC_SMTP_PASSWORD: ${MAIL_PASSWORD:-}
    # --import-realm loads platform-realm.json on a fresh DB (skipped once the realm exists).
    command: [ "start-dev", "--import-realm" ]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    volumes:
      - ../keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
    networks:
      - shared-network

  # --- Per-service databases (database-per-service pattern) ---

  anomaly-postgres:
    image: "postgres:17.4"
    container_name: "anomaly-postgres"
    mem_limit: 256m
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=anomaly
      - POSTGRES_PASSWORD=anomaly
      - POSTGRES_DB=anomaly_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - anomaly-postgres-data:/var/lib/postgresql/data
    networks:
      - shared-network

  ratelimit-postgres:
    image: "postgres:17.4"
    container_name: "ratelimit-postgres"
    mem_limit: 256m
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=ratelimit
      - POSTGRES_PASSWORD=ratelimit
      - POSTGRES_DB=ratelimit_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ratelimit-postgres-data:/var/lib/postgresql/data
    networks:
      - shared-network

  tracing-postgres:
    image: "postgres:17.4"
    container_name: "tracing-postgres"
    mem_limit: 256m
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=tracing
      - POSTGRES_PASSWORD=tracing
      - POSTGRES_DB=tracing_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - tracing-postgres-data:/var/lib/postgresql/data
    networks:
      - shared-network

  fault-postgres:
    image: "postgres:17.4"
    container_name: "fault-postgres"
    mem_limit: 256m
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=fault
      - POSTGRES_PASSWORD=fault
      - POSTGRES_DB=fault_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - fault-postgres-data:/var/lib/postgresql/data
    networks:
      - shared-network

  # --- Redis (only for services that need it) ---

  ratelimit-redis:
    image: "redis:7.4"
    container_name: "ratelimit-redis"
    mem_limit: 256m
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ratelimit-redis-data:/data
    networks:
      - shared-network

  anomaly-redis:
    image: "redis:7.4"
    container_name: "anomaly-redis"
    mem_limit: 256m
    ports:
      - "6380:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - anomaly-redis-data:/data
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge
volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  roaming-mysql-data:
  keycloak-postgres-data:
  anomaly-postgres-data:
  ratelimit-postgres-data:
  tracing-postgres-data:
  fault-postgres-data:
  ratelimit-redis-data:
  anomaly-redis-data: