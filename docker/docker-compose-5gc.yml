# =============================================================================
#  docker-compose-5gc.yml — free5GC 5G Core, integrated into the platform stack
# =============================================================================
#  Runs the free5GC NFs (NRF/AMF/SMF/UPF/AUSF/UDM/UDR/PCF/NSSF) + MongoDB +
#  WebConsole ON THE SAME `shared-network` as the rest of the platform (Keycloak,
#  observability, etc.) so the harness can reach them (gateway → NRF, Prometheus →
#  NF metrics, Fluent Bit → NF logs).
#
#  ⚠️ LINUX ONLY — the UPF needs the host `gtp5g` kernel module.
#     On Windows/Mac: ./infra.sh 5gc up  (automatically skips UPF)
#
#  ⚠️ CONFIG SOURCE — NF config and cert files are mounted from a cloned copy of
#     the upstream free5gc-compose repo. One-time setup (already done):
#       git clone https://github.com/free5gc/free5gc-compose.git E:/My-project/free5gc-compose
#     F5GC_DIR and F5GC_TAG are set in docker/.env
#
#  Run standalone via:
#     ./infra.sh 5gc up
#  Run with full infra via:
#     ./infra.sh up --5gc
# =============================================================================

services:

  # --- Subscriber / NF-context store -----------------------------------------
  free5gc-db:
    container_name: free5gc-db
    image: mongo:6.0.4
    command: mongod --port 27017
    expose:
      - "27017"
    volumes:
      - free5gc-dbdata:/data/db
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.10
        aliases:
          - db

  # --- NRF (registry + OAuth2 authz server) ----------------------------------
  free5gc-nrf:
    container_name: free5gc-nrf
    image: free5gc/nrf:${F5GC_TAG:-v3.4.4}
    command: ./nrf -c ./config/nrfcfg.yaml
    environment:
      - DB_URI=mongodb://db/free5gc
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
      - ${F5GC_DIR}/cert:/free5gc/cert
    expose:
      - "8000"
    ports:
      - "19001:9091"   # Prometheus metrics
    depends_on:
      - free5gc-db
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.nrf"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.20
        aliases:
          - nrf.free5gc.org

  # --- AUSF ------------------------------------------------------------------
  free5gc-ausf:
    container_name: free5gc-ausf
    image: free5gc/ausf:${F5GC_TAG:-v3.4.4}
    command: ./ausf -c ./config/ausfcfg.yaml
    environment:
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
      - ${F5GC_DIR}/cert:/free5gc/cert
    ports:
      - "19004:9091"   # Prometheus metrics
    depends_on:
      - free5gc-nrf
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.ausf"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.21
        aliases:
          - ausf.free5gc.org

  # --- UDM -------------------------------------------------------------------
  free5gc-udm:
    container_name: free5gc-udm
    image: free5gc/udm:${F5GC_TAG:-v3.4.4}
    command: ./udm -c ./config/udmcfg.yaml
    environment:
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
      - ${F5GC_DIR}/cert:/free5gc/cert
    ports:
      - "19005:9091"   # Prometheus metrics
    depends_on:
      - free5gc-nrf
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.udm"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.22
        aliases:
          - udm.free5gc.org

  # --- UDR -------------------------------------------------------------------
  free5gc-udr:
    container_name: free5gc-udr
    image: free5gc/udr:${F5GC_TAG:-v3.4.4}
    command: ./udr -c ./config/udrcfg.yaml
    environment:
      - DB_URI=mongodb://db/free5gc
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
      - ${F5GC_DIR}/cert:/free5gc/cert
    ports:
      - "19006:9091"   # Prometheus metrics
    depends_on:
      - free5gc-nrf
      - free5gc-db
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.udr"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.23
        aliases:
          - udr.free5gc.org

  # --- PCF -------------------------------------------------------------------
  free5gc-pcf:
    container_name: free5gc-pcf
    image: free5gc/pcf:${F5GC_TAG:-v3.4.4}
    command: ./pcf -c ./config/pcfcfg.yaml
    environment:
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
      - ${F5GC_DIR}/cert:/free5gc/cert
    ports:
      - "19007:9091"   # Prometheus metrics
    depends_on:
      - free5gc-nrf
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.pcf"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.24
        aliases:
          - pcf.free5gc.org

  # --- NSSF ------------------------------------------------------------------
  free5gc-nssf:
    container_name: free5gc-nssf
    image: free5gc/nssf:${F5GC_TAG:-v3.4.4}
    command: ./nssf -c ./config/nssfcfg.yaml
    environment:
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
      - ${F5GC_DIR}/cert:/free5gc/cert
    ports:
      - "19008:9091"   # Prometheus metrics
    depends_on:
      - free5gc-nrf
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.nssf"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.25
        aliases:
          - nssf.free5gc.org

  # --- SMF (session mgmt; PFCP to UPF) ---------------------------------------
  free5gc-smf:
    container_name: free5gc-smf
    image: free5gc/smf:${F5GC_TAG:-v3.4.4}
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    environment:
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
      - ${F5GC_DIR}/cert:/free5gc/cert
    ports:
      - "19003:9091"   # Prometheus metrics
    depends_on:
      - free5gc-nrf
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.smf"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.26
        aliases:
          - smf.free5gc.org

  # --- AMF (access & mobility; NGAP/SCTP to the gNB) -------------------------
  free5gc-amf:
    container_name: free5gc-amf
    image: free5gc/amf:${F5GC_TAG:-v3.4.4}
    command: ./amf -c ./config/amfcfg.yaml
    environment:
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
      - ${F5GC_DIR}/cert:/free5gc/cert
    expose:
      - "38412/sctp"
    ports:
      - "19002:9091"   # Prometheus metrics
    depends_on:
      - free5gc-nrf
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.amf"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.27
        aliases:
          - amf.free5gc.org

  # --- UPF (user plane; GTP-U — REQUIRES gtp5g kernel module) ------------------
  #  ⚠️  Windows/Mac: always exits with "operation not supported" because gtp5g
  #     is a custom Linux kernel module.  UPF is ONLY needed for PDU sessions
  #     (data-plane internet through 5GC).  UE registration works without it.
  #
  #  This service is opt-in via the "upf" profile:
  #    Linux:   docker compose --profile upf -f docker/docker-compose-5gc.yml up -d
  #    Windows: docker compose         -f docker/docker-compose-5gc.yml up -d   ← skips UPF
  free5gc-upf:
    container_name: free5gc-upf
    image: free5gc/upf:${F5GC_TAG:-v3.4.4}
    command: ./upf -c ./config/upfcfg.yaml
    profiles:
      - upf
    cap_add:
      - NET_ADMIN
    privileged: true
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
    depends_on:
      - free5gc-smf
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.upf"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.101
        aliases:
          - upf.free5gc.org

  # --- UERANSIM gNB (simulated 5G base-station; connects to AMF via NGAP/SCTP) ---
  #  Uses ./ueransim/gnbcfg.yaml (linkIp: 0.0.0.0 so the UE container can reach it)
  free5gc-gnb:
    container_name: free5gc-gnb
    image: free5gc/ueransim:latest
    command: ./nr-gnb -c ./config/gnbcfg.yaml
    volumes:
      - ./ueransim:/ueransim/config
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    depends_on:
      - free5gc-amf
    networks:
      privnet:
        ipv4_address: 10.100.200.50
        aliases:
          - gnb.free5gc.org

  # --- UERANSIM UE (simulated subscriber; registers through the gNB) -----------
  free5gc-ue:
    container_name: free5gc-ue
    image: free5gc/ueransim:latest
    command: ./nr-ue -c ./config/uecfg.yaml
    volumes:
      - ./ueransim:/ueransim/config
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    depends_on:
      - free5gc-gnb
    networks:
      privnet:
        ipv4_address: 10.100.200.51

  # --- WebConsole (subscriber provisioning UI + REST) ------------------------
  free5gc-webui:
    container_name: free5gc-webui
    image: free5gc/webui:${F5GC_TAG:-v3.4.4}
    command: ./webui -c ./config/webuicfg.yaml
    environment:
      - GIN_MODE=release
    volumes:
      - ${F5GC_DIR}/config:/free5gc/config
    ports:
      - "5000:5000"
    depends_on:
      - free5gc-db
      - free5gc-nrf
    logging:
      driver: fluentd
      options:
        fluentd-address: "host.docker.internal:24224"
        tag: "free5gc.webui"
        fluentd-async: "true"
    networks:
      shared-network: {}
      privnet:
        ipv4_address: 10.100.200.30
        aliases:
          - webui

# -----------------------------------------------------------------------------
#  Networks
#   • shared-network — joined as EXTERNAL so the NFs share the existing platform
#     bridge (Keycloak, observability, etc.) without creating a new isolated one.
#   • privnet        — free5GC's private subnet with STATIC IPs and DNS aliases
#     so NFs find each other by hostname (e.g. nrf.free5gc.org → 10.100.200.20).
# -----------------------------------------------------------------------------
networks:
  shared-network:
    external: true
    name: docker_shared-network
  privnet:
    ipam:
      driver: default
      config:
        - subnet: 10.100.200.0/24

volumes:
  free5gc-dbdata:
