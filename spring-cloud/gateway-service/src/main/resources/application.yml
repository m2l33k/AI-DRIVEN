app:
  jwk-set-uri: ${APP_KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/auth-management/protocol/openid-connect/certs}
prometheus:
  base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
server:
  port: 9000
  netty:
    connection-timeouts: 2s
    idle-timeouts: 15s
  shutdown: graceful
spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 15s

  cloud:
    gateway:
      server:
        webflux:
          # Auto-route to services registered in Eureka via /<service-id>/**
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: auth-service-docs
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
            - id: roaming-analysis-service
              uri: lb://roaming-analysis-service
              predicates:
                - Path=/api/roaming/**
            - id: roaming-analysis-service-docs
              uri: lb://roaming-analysis-service
              predicates:
                - Path=/roaming-analysis-service/v3/api-docs
              filters:
                - RewritePath=/roaming-analysis-service/(?<segment>.*), /$\{segment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      uri: "http_server_requests"
    endpoint:
      gateway:
        enabled: true
      metrics:
        enabled: true
      prometheus:
        enabled: true
      health:
        show-details: always
    distribution:
      percentiles-histogram: # enable histogram for percentile
        http.server.requests: true
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 500ms, 1s


# Security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/auth-management}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/auth-management/protocol/openid-connect/certs}
logging:
  level:
    root: INFO
    io.example.springcloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{trace_id:-N/A}] [%X{span_id:-N/A}] %-5level %logger{36} - %msg%n"

springdoc:
  # Document the actuator endpoints (health, info, metrics, prometheus) in the spec,
  # so the gateway's own Swagger shows operations even before business routes exist.
  show-actuator: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
    # Aggregated view: one entry per API. Downstream services are reachable through
    # the Eureka discovery locator at /<service-id>/v3/api-docs, so add a line per
    # service as you register them (uncomment the example below).
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: roaming-analysis-service
        url: /roaming-analysis-service/v3/api-docs
---
app:
  jwk-set-uri: http://keycloak:8080/realms/auth-management/protocol/openid-connect/certs
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: auth-service-docs
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
            - id: roaming-analysis-service
              uri: lb://roaming-analysis-service
              predicates:
                - Path=/api/roaming/**
            - id: roaming-analysis-service-docs
              uri: lb://roaming-analysis-service
              predicates:
                - Path=/roaming-analysis-service/v3/api-docs
              filters:
                - RewritePath=/roaming-analysis-service/(?<segment>.*), /$\{segment}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/auth-management
          jwk-set-uri: http://keycloak:8080/realms/auth-management/protocol/openid-connect/certs
prometheus:
  base-url: http://prometheus:9090
