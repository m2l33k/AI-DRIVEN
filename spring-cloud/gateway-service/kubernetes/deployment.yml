apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]
          ports:
            - containerPort: 9000
          env:
            - name: APP_KEYCLOAK_JWK_SET_URI
              value: http://keycloak:8080/realms/auth-management/protocol/openid-connect/certs
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak:8080/realms/auth-management
            - name: KEYCLOAK_JWK_SET_URI
              value: http://keycloak:8080/realms/auth-management/protocol/openid-connect/certs