server:
  port: 9008
  shutdown: graceful

spring:
  application:
    name: fivegc-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/auth-management}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/auth-management/protocol/openid-connect/certs}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}

free5gc:
  webconsole:
    url: ${FREE5GC_WEBCONSOLE_URL:http://localhost:5000}
    username: ${FREE5GC_USERNAME:admin}
    password: ${FREE5GC_PASSWORD:free5gc}

docker:
  host: ${DOCKER_HOST:tcp://localhost:2375}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{trace_id:-N/A}] [%X{span_id:-N/A}] %-5level %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/auth-management
          jwk-set-uri: http://keycloak:8080/realms/auth-management/protocol/openid-connect/certs
  data:
    mongodb:
      uri: mongodb://mongodb:27017

free5gc:
  webconsole:
    url: http://free5gc-webui:5000

docker:
  host: unix:///var/run/docker.sock

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
