server:
  port: 9003
  shutdown: graceful

spring:
  application:
    name: anomaly-detection-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: ${ANOMALY_DB_URL:jdbc:postgresql://localhost:5433/anomaly_db}
    username: ${ANOMALY_DB_USERNAME:anomaly}
    password: ${ANOMALY_DB_PASSWORD:anomaly}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${ANOMALY_REDIS_HOST:localhost}
      port: ${ANOMALY_REDIS_PORT:6380}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{trace_id:-N/A}] [%X{span_id:-N/A}] %-5level %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://anomaly-postgres:5432/anomaly_db
    username: anomaly
    password: anomaly
  data:
    redis:
      host: anomaly-redis
      port: 6379
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
