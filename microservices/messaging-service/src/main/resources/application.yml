server:
  port: 9007
  shutdown: graceful

spring:
  application:
    name: messaging-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: ${MESSAGING_DB_URL:jdbc:postgresql://localhost:5438/messaging_db}
    username: ${MESSAGING_DB_USERNAME:messaging}
    password: ${MESSAGING_DB_PASSWORD:messaging}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/auth-management}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/auth-management/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{trace_id:-N/A}] [%X{span_id:-N/A}] %-5level %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://messaging-postgres:5432/messaging_db
    username: messaging
    password: messaging
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/auth-management
          jwk-set-uri: http://keycloak:8080/realms/auth-management/protocol/openid-connect/certs
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
