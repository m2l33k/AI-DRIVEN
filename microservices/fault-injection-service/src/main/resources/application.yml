server:
  port: 9006
  shutdown: graceful

spring:
  application:
    name: fault-injection-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: ${FAULT_DB_URL:jdbc:postgresql://localhost:5436/fault_db}
    username: ${FAULT_DB_USERNAME:fault}
    password: ${FAULT_DB_PASSWORD:fault}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{trace_id:-N/A}] [%X{span_id:-N/A}] %-5level %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://fault-postgres:5432/fault_db
    username: fault
    password: fault
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
